[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "event-brief"
version = "0.1.0"
description = "Validate source-linked research briefs and render them offline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Colton Gingrass"}]
dependencies = []

[project.optional-dependencies]
pdf = ["pillow>=12.0", "reportlab>=4.4"]

[dependency-groups]
dev = ["pillow>=12.0", "reportlab>=4.4", "pypdf>=6.0", "pip-audit>=2.9", "bandit>=1.8"]

[project.scripts]
event-brief = "event_brief.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/event_brief"]
